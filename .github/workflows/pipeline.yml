name: Pipeline CI - Pruebas Automatizadas

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      # 1. Clonar el repositorio
      - name: Clonar repositorio
        uses: actions/checkout@v6

      # 2. Configurar .NET
      - name: Configurar .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # 3. Restaurar dependencias
      - name: Restaurar dependencias
        run: dotnet restore

      # 4. Ejecutar las pruebas y generar reporte
      - name: Ejecutar pruebas automatizadas
        run: dotnet test --logger "trx;LogFileName=resultados.trx"

      # 5. Guardar el reporte
      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: "**/TestResults/*.trx"

      # 6. Notificar resultado
      - name: Notificar resultado
        if: always()
        run: echo "El pipeline ha finalizado. Revise los resultados en GitHub Actions."